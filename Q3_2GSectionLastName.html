<!DOCTYPE html>
<head>
	<meta charset="UTF-8">
	<title>HTML Forms</title>
</head>
<body>
	<form>
		<p>1. Student Identification Number:</p>
		<input type="text" id="studentId" name="studentId" placeholder="00000000" required> <br>

		<p>2. Government Name:</p>
		<input type="text" id="name" name="name" placeholder="Last, First, M.I." required> <br>

		<p>3. Birthdate:</p>
		<input type="datetime-local" id="birthdate" name="birthdate" placeholder="YYYY-MM-DD hr:min" min="1911-01-18T00:00" required> <br>

		<p>4. Email Address:</p>
		<input type="text" id="email" name="email" placeholder="address@email.com" required> <br>

		<p>5. Mobile Phone Number:</p>
		<input type="text" id="number" name="number" placeholder="(+63) 999 9999 999" required> <br>

		<p>6. Present Grade Level:</p>
		<select id="grade" name="grade" required>
			<option value="grade7">Grade 7</option>
			<option value="grade8">Grade 8</option>
			<option value="grade9" selected>Grade 9</option>
			<option value="grade10">Grade 10</option>
			<option value="grade11">Grade 11</option>
			<option value="grade12">Grade 12</option>
		</select>

		<p>7. Intern or Extern:</p>
		<input type="radio" id="residenceIntern" name="residence" value="Intern" required> <label for="residenceIntern">Intern</label><br>
		<input type="radio" id="residenceExtern" name="residence" value="Extern" required> <label for="residenceExtern">Extern</label> <br>

		<p>8. Preferred Organization:</p>
		<select id="org" name="org" required>
			<option value="MTP">Mathematics Training Program</option>
			<option value="Trophy">Trophy</option>
			<option value="Reboot" selected>Reboot Computer Programming / Artificial Intelligence</option>
			<option value="PAHAM">PAHAM</option>
			<option value="ChemTeam">Chemistry Team</option>
			<option value="BioTeam">Biology Team</option>
		</select>

		<p>9. Why do you want to join?:</p>
		<textarea id="reason" name="reason" size="500" rows="10" cols="50"> Let's go, Reboot!
		</textarea> <br><br>

	<br>
	<button type="button" id="localSubmit">Submit</button>
	<input type="reset" value="Reset">
	</form>
	<div id="result"></div>
	<script>
		var form = document.querySelector('form');
		if (!form) {
			var resultElement = document.getElementById('result');
			if (resultElement) {
				resultElement.innerHTML = 'No form found';
			}
		}
		var fields = form.querySelectorAll('[name]');
		var resultElement = document.getElementById('result');
		var storageAvailable = (typeof Storage !== 'undefined');
		function tryGet(key) {
			if (!storageAvailable) return null;
			try {
				return localStorage.getItem(key);
			} catch (err) {
				storageAvailable = false;
				if (resultElement) resultElement.innerText = 'localStorage read error: ' + err.message;
				console.error('localStorage.getItem error', err);
				return null;
			}
		}
		function trySet(key, value) {
			if (!storageAvailable) return false;
			try {
				localStorage.setItem(key, value);
				return true;
			} catch (err) {
				storageAvailable = false;
				if (resultElement) resultElement.innerText = 'localStorage write error: ' + err.message;
				console.error('localStorage.setItem error', err);
				return false;
			}
		}
		if (!storageAvailable) {
			if (resultElement) resultElement.innerHTML = 'localStorage not supported in this browser';
		}

		for (var i = 0; i < fields.length; i++) {
			var element = fields[i], key = element.name, value = null;
			value = tryGet(key);
			console.log('restore attempt', key, value);
			if (value === null){continue;}
			if (element.type === 'radio'){
				if (element.value === value){element.checked = true;}
			}
			else if (element.type === 'checkbox'){element.checked = (value === '1');}
			else {element.value = value;}
		}

		for (var i = 0; i < fields.length; i++) {
			(function(element){
				function saveIt() {
					if (!storageAvailable) return;
					var j = element.name;
					var ok = true;
					if (element.type === 'checkbox') ok = trySet(j, element.checked ? '1' : '0');
					else if (element.type === 'radio') {
						if (element.checked) ok = trySet(j, element.value);
					}
					else ok = trySet(j, element.value);
					console.log('save attempt', j, element.type === 'checkbox' ? (element.checked ? '1' : '0') : element.value, ok);
					if (ok) {
						if (resultElement) resultElement.innerHTML = 'Saved locally: ' + j;
					}
				}
				element.addEventListener('input', saveIt);
				element.addEventListener('blur', saveIt);
				element.addEventListener('change', saveIt);
			})(fields[i]);
		}
		form.addEventListener('reset', function() {
			setTimeout(function() {
				if (window.localStorage) {
					for (var i = 0; i < fields.length; i++) {
						localStorage.removeItem(fields[i].name);
					}
				}
				if (resultElement) resultElement.innerHTML = 'Cleared';
				if (fields.length) fields[0].focus();
			}, 0);
		});
		var submitBtn = document.getElementById('localSubmit');
		if (submitBtn) {
			submitBtn.addEventListener('click', function() {
				if (storageAvailable) {
					for (var i = 0; i < fields.length; i++) {
						localStorage.removeItem(fields[i].name);
					}
				}
				if (resultElement) resultElement.innerHTML = 'Submitted';
				// disable briefly to prevent accidental double-clicks
				submitBtn.disabled = true;
				setTimeout(function() { submitBtn.disabled = false; }, 1200);
			});
		}
	</script>
</body>
