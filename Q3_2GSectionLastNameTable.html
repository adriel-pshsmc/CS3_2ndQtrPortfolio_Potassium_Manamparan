<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>List of Sign-ups</title>
</head>
<body>
    <p ><a href="Q3_2GSectionLastName.html">Return to sign-ups</a></p>
    <h1>List of Sign-ups</h1>
    <p>
        Filter by organization:
        <select id="orgFilter">
            <option value="all">All</option>
            <option value="MTP">Mathematics Training Program</option>
            <option value="Trophy">Trophy</option>
            <option value="Reboot">Reboot Computer Programming / Artificial Intelligence</option>
            <option value="PAHAM">PAHAM</option>
            <option value="ChemTeam">Chemistry Team</option>
            <option value="BioTeam">Biology Team</option>
        </select>
    </p>
    <p>Total Number of Sign-ups: <a name="totalSignUps"></a></p>
    <table style="border: 1px solid black;">
        <thead>
        <tr style = "background-color: rgb(5, 5, 71); color: white">
            <th>Student ID</th>
            <th>Name</th>
            <th>Birthdate</th>
            <th>Email</th>
            <th>Phone Number</th>
            <th>Grade Level</th>
            <th>Residence</th>
            <th>Preferred Organization</th>
            <th>Reason for Joining</th>
        </tr>
        </thead>
        <tbody id="signupsBody"></tbody>
    </table>

    <script>
    (function(){
        var total = document.querySelector('a[name="totalSignUps"]');
        if (!total) return;
        function updateCount(){
            var arr = [];
            for (var i = 0; i < localStorage.length; i++){
                try{
                    var key = localStorage.key(i);
                    if (!key || key.indexOf('signup:') !== 0) continue;
                    var value = localStorage.getItem(key);
                    if (!value) continue;
                    var parsed = JSON.parse(value);
                    arr.push(parsed);
                } catch(e) {}
            }
            var filterElement = document.getElementById('orgFilter');
            var selected = filterElement ? filterElement.value : 'all';
            var filtered = (selected === 'all') ? arr : arr.filter(function(item){ return item && item.org === selected; });
            total.textContent = filtered.length;
            var body = document.getElementById('signupsBody');
            if (!body) return;
            body.innerHTML = '';
            var fields = ['studentId','name','birthdate','email','number','grade','residence','org','reason'];
            for (var j = 0; j < filtered.length; j++){
                var item = filtered[j];
                var tr = document.createElement('tr');
                for (var k = 0; k < fields.length; k++){
                    var td = document.createElement('td');
                    var v = item[fields[k]];
                    td.textContent = (v === undefined || v === null) ? '' : v;
                    tr.appendChild(td);
                }
                body.appendChild(tr);
            }
        }
        updateCount();
        window.addEventListener('storage', updateCount);
        setInterval(updateCount, 1500);
        var filterElement = document.getElementById('orgFilter');
        if (filterElement) filterElement.addEventListener('change', updateCount);
    })();
    </script>
    </body>
