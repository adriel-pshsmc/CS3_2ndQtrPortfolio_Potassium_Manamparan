<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Q4 - Add Movie</title>
    <style>
        body {
            font-family: Helvetica, Arial;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f6fb;
            padding: 20px;
        }
        .center-box{
            width: 100%;
            max-width: 820px;
            background: #ffffff;
            padding: 26px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(18,38,63,0.08);
        }
        form {
            display: grid;
            gap: 8px;
            max-width: 420px;
        }
        label {
            display: flex;
            flex-direction: column;
            font-weight: 600;
        }
        input, select, button {
            padding: 8px; font-size: 1rem;
        }
        ul {
            list-style: none; 
            padding-left: 0;
        }
        li {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #f6f6f6; 
            padding: 8px; 
            margin: 6px 0px; 
            border-radius: 6px;
        }
            .meta {
                color: #444; 
                font-size: 0.95rem;
            }
            .delete-btn {
                background: #e74c3c; 
                color: white; border: 0;
                padding: 6px 10px; 
                border-radius: 4px; 
                cursor: pointer;
            }
            .delete-btn:hover {
                opacity: 0.9;
            }
            .rating-row {
                display: flex; 
                gap: 6px; 
                align-items: center;
            }
            .stars {
                display: inline-flex; 
                gap: 4px;
            }
            .star {
                font-size: 1.4rem;
                color: #cbd5e1;
                cursor: pointer;
                user-select: none;
                transition: color .12s ease;
            }
            .star.filled {
                color: #f6c85f; /* gold */
            }
            .star.hover {
                color: #ffd66b;
            }
            .display-rating .star {
                cursor: default;
            }
    </style>
</head>
<body>
    <div class="center-box">
    <h1 style="margin-top:0">Add Movie</h1>
    <form id="movieForm">
        <label>Title
            <input id="title" name="title" type="text" required placeholder="Movie title">
        </label>
        <label>Year
            <input id="year" name="year" type="number" min="1800" max="2099" required placeholder="2026">
        </label>
        <label>Genre
            <select id="genre" name="genre">
                <option value="Action">Action</option>
                <option value="Comedy">Comedy</option>
                <option value="Drama">Drama</option>
                <option value="Horror">Horror</option>
                <option value="Sci-Fi">Sci-Fi</option>
                <option value="Documentary">Documentary</option>
                <option value="Other">Other</option>
            </select>
        </label>
    
        <label>Rating
            <input type="hidden" id="rating" name="rating" value="0">
            <div class="rating-row">
                <div class="stars" id="starInputs" aria-label="Rating">
                    <span class="star" data-value="1" title="1 star">★</span>
                    <span class="star" data-value="2" title="2 stars">★</span>
                    <span class="star" data-value="3" title="3 stars">★</span>
                    <span class="star" data-value="4" title="4 stars">★</span>
                    <span class="star" data-value="5" title="5 stars">★</span>
                </div>
                <small style="color:#666">(0–5)</small>
            </div>
        </label>

        <button type="submit">Add Movie</button>
    </form>

    <h2>Saved Movies</h2>
    <ul id="moviesList" aria-live="polite"></ul>
    </div>

<script>
    const MOVIE_KEYS = 'movie_keys';

    function getKeys(){
        const raw = localStorage.getItem(MOVIE_KEYS);
        try{
            const parsed = raw ? JSON.parse(raw) : [];
            if(Array.isArray(parsed)) return parsed;
            return [];
        }catch(e){
            console.warn('Corrupt keys array in localStorage, resetting.');
            localStorage.removeItem(MOVIE_KEYS);
            return [];
        }
    }

    function saveKeys(keys){
        localStorage.setItem(MOVIE_KEYS, JSON.stringify(keys));
    }

    function addMovieToStorage(movie){
        const key = 'movie_' + Date.now();
        localStorage.setItem(key, JSON.stringify(movie));
        const keys = getKeys();
        keys.push(key);
        saveKeys(keys);
    }

    function deleteMovie(key){
        localStorage.removeItem(key);
        const keys = getKeys().filter(k => k !== key);
        saveKeys(keys);
        renderMovies();
    }

    function renderMovies(){
        const listEl = document.getElementById('moviesList');
        listEl.innerHTML = '';
        const keys = getKeys();
        const validKeys = [];

        keys.forEach(key => {
            const raw = localStorage.getItem(key);
            if(!raw) return;
            try{
                const movie = JSON.parse(raw);
                validKeys.push(key);

                const li = document.createElement('li');
                const left = document.createElement('div');
                left.className = 'meta';
                const titleHtml = `<div class="meta-title">${escapeHtml(movie.title)} (${escapeHtml(String(movie.year))}) — ${escapeHtml(movie.genre)}</div>`;
                const ratingVal = Number(movie.rating) || 0;
                const starsHtml = `<div class="display-rating" aria-hidden="true">${renderStarsHtml(ratingVal)}</div>`;
                left.innerHTML = titleHtml + starsHtml;

                const del = document.createElement('button');
                del.className = 'delete-btn';
                del.type = 'button';
                del.textContent = 'Delete';
                del.addEventListener('click', () => {
                    if(confirm(`Delete "${movie.title}"?`)) deleteMovie(key);
                });

                li.appendChild(left);
                li.appendChild(del);
                listEl.appendChild(li);
            }catch(e){
                console.warn('Failed to parse stored movie for key', key);
            }
        });

        if(JSON.stringify(validKeys) !== JSON.stringify(keys)){
            saveKeys(validKeys);
        }

        if(validKeys.length === 0){
            const empty = document.createElement('li');
            empty.textContent = 'No movies yet. Add one using the form above.';
            empty.style.fontStyle = 'italic';
            empty.style.color = '#666';
            listEl.appendChild(empty);
        }
    }

    function renderStarsHtml(rating){
        let out = '';
        for(let i=1;i<=5;i++){
            const cls = i<=rating ? 'star filled' : 'star';
            out += `<span class="${cls}">★</span>`;
        }
        return out;
    }

    function escapeHtml(s){
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function initStarInputs(){
        const stars = Array.from(document.querySelectorAll('#starInputs .star'));
        const hidden = document.getElementById('rating');
        let current = Number(hidden.value) || 0;

        function updateUI(val){
            stars.forEach(s => {
                const v = Number(s.dataset.value);
                s.classList.toggle('filled', v <= val);
            });
        }

        stars.forEach(s => {
            s.addEventListener('mouseover', () => {
                const v = Number(s.dataset.value);
                stars.forEach(st => st.classList.toggle('hover', Number(st.dataset.value) <= v));
            });
            s.addEventListener('mouseout', () => {
                stars.forEach(st => st.classList.remove('hover'));
            });
            s.addEventListener('click', () => {
                const v = Number(s.dataset.value);
                current = v;
                hidden.value = String(v);
                updateUI(v);
            });
        });

        updateUI(current);
        const form = document.getElementById('movieForm');
        form.addEventListener('reset', () => {
            hidden.value = '0';
            current = 0;
            updateUI(0);
        });
    }

    document.getElementById('movieForm').addEventListener('submit', (ev) => {
        ev.preventDefault();
        const title = document.getElementById('title').value.trim();
        const yearValue = document.getElementById('year').value;
        const genre = document.getElementById('genre').value;

        if(!title){ alert('Please enter a title'); return; }
        const year = Number(yearValue);
        if(!Number.isFinite(year) || year < 1800 || year > 2099){ alert('Please enter a valid year'); return; }

        const rating = Number(document.getElementById('rating').value) || 0;
        const movie = {title, year, genre, rating};
        addMovieToStorage(movie);

        ev.target.reset();
        document.getElementById('title').focus();

        renderMovies();
    });

    window.addEventListener('DOMContentLoaded', () => {
        if(localStorage.getItem(MOVIE_KEYS) === null) saveKeys([]);
        initStarInputs();
        renderMovies();
    });
</script>
</body>
</html>
